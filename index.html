<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Changer</title>
    <link rel="shortcut icon" href="./assets/images/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="./src/style.css">
</head>

<body id="bg-canvas" class="min-h-screen transition-colors duration-500 flex items-center justify-center p-4 sm:p-6 lg:p-12 bg-slate-800">
    <main class="w-full max-w-xs sm:max-w-sm md:max-w-md bg-gradient-to-b from-slate-200 via-slate-300 to-slate-400 rounded-3xl p-5 sm:p-7 md:p-8 shadow-[0_20px_50px_rgba(0,0,0,0.6),inset_0_2px_4px_rgba(255,255,255,0.9),inset_0_-4px_6px_rgba(0,0,0,0.4)] border-2 border-slate-400/60">
        <!-- Top Corner Screws & Branding -->
        <div class="flex justify-between items-center mb-4 sm:mb-6">
            <div class="w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full bg-gradient-to-tr from-slate-400 to-slate-100 shadow-[inset_0_1px_2px_rgba(0,0,0,0.6)] flex items-center justify-center">
                <div class="w-2 h-[1.5px] bg-slate-600 rotate-45"></div>
            </div>
            <div class="text-[10px] sm:text-xs font-black tracking-widest text-slate-500 uppercase">
                Color-Changer
            </div>
            <div class="w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full bg-gradient-to-tr from-slate-400 to-slate-100 shadow-[inset_0_1px_2px_rgba(0,0,0,0.6)] flex items-center justify-center">
                <div class="w-2 h-[1.5px] bg-slate-600 -rotate-45"></div>
            </div>
        </div>

        <!-- Backlit LCD Digital Screen -->
        <section class="bg-emerald-950 p-4 sm:p-6 rounded-2xl border-4 border-slate-500/80 shadow-[inset_0_4px_10px_rgba(0,0,0,0.9),0_2px_4px_rgba(255,255,255,0.4)] mb-5 sm:mb-6 text-center">
            <p class="text-emerald-500/70 text-[10px] sm:text-xs font-mono uppercase tracking-widest mb-1">
                Color Code
            </p>
            <div id="hex-text" class="text-3xl sm:text-4xl md:text-5xl font-mono font-bold text-emerald-400 tracking-wider drop-shadow-[0_0_8px_rgba(52,211,153,0.8)]">
                #3B82F6
            </div>
        </section>

        <!-- Main Random Trigger Button -->
        <div class="mb-5 sm:mb-6">
            <button id="random-btn" class="w-full py-3.5 sm:py-4 px-4 rounded-xl font-bold text-slate-800 text-base sm:text-lg uppercase tracking-wider bg-gradient-to-b from-amber-300 via-amber-400 to-amber-500 shadow-[0_6px_0_#b45309,0_10px_15px_rgba(0,0,0,0.4),inset_0_2px_2px_rgba(255,255,255,0.8)] active:shadow-[0_2px_0_#b45309,inset_0_2px_4px_rgba(0,0,0,0.4)] active:translate-y-1 transition-all flex items-center justify-center gap-2 cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Random Color
            </button>
        </div>

        <!-- Preset Color Switches -->
        <section>
            <h2 class="text-[10px] sm:text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">
                Presets
            </h2>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 sm:gap-3">
                <button onclick="changeBg('#EF4444')" class="py-2.5 sm:py-3 rounded-lg bg-gradient-to-b from-red-400 to-red-600 text-white font-bold text-xs uppercase shadow-[0_4px_0_#991b1b,0_5px_8px_rgba(0,0,0,0.3),inset_0_1px_1px_rgba(255,255,255,0.6)] active:shadow-[0_1px_0_#991b1b,inset_0_2px_3px_rgba(0,0,0,0.4)] active:translate-y-1 transition-all cursor-pointer">
                    Red
                </button>
                <button onclick="changeBg('#10B981')" class="py-2.5 sm:py-3 rounded-lg bg-gradient-to-b from-emerald-400 to-emerald-600 text-white font-bold text-xs uppercase shadow-[0_4px_0_#065f46,0_5px_8px_rgba(0,0,0,0.3),inset_0_1px_1px_rgba(255,255,255,0.6)] active:shadow-[0_1px_0_#065f46,inset_0_2px_3px_rgba(0,0,0,0.4)] active:translate-y-1 transition-all cursor-pointer">
                    Green
                </button>
                <button onclick="changeBg('#3B82F6')" class="py-2.5 sm:py-3 rounded-lg bg-gradient-to-b from-blue-400 to-blue-600 text-white font-bold text-xs uppercase shadow-[0_4px_0_#1e40af,0_5px_8px_rgba(0,0,0,0.3),inset_0_1px_1px_rgba(255,255,255,0.6)] active:shadow-[0_1px_0_#1e40af,inset_0_2px_3px_rgba(0,0,0,0.4)] active:translate-y-1 transition-all cursor-pointer">
                    Blue
                </button>
                <button onclick="changeBg('#8B5CF6')" class="py-2.5 sm:py-3 rounded-lg bg-gradient-to-b from-purple-400 to-purple-600 text-white font-bold text-xs uppercase shadow-[0_4px_0_#5b21b6,0_5px_8px_rgba(0,0,0,0.3),inset_0_1px_1px_rgba(255,255,255,0.6)] active:shadow-[0_1px_0_#5b21b6,inset_0_2px_3px_rgba(0,0,0,0.4)] active:translate-y-1 transition-all cursor-pointer">
                    Purple
                </button>
            </div>
        </section>
    </main>

    <!-- Add external JS file -->
    <script type="module" src="./src/main.js"></script>
</body>

</html>
